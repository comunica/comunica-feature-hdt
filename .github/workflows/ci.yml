name: "CI"
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version:
          - 22.x
          - 24.x
          - 26.x
    steps:
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Ensure line endings are consistent
        run: git config --global core.autocrlf input
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Load cache
        uses: actions/cache@v6
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-test-modules-v1-${{ hashFiles('**/yarn.lock') }}
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines
      - name: Build project
        run: yarn run build
      - name: Run tests
        run: yarn run test-ci
      - name: Submit coverage results
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.github_token }}
          flag-name: run-${{ matrix.node-version }}
          parallel: true
      - name: Run integration tests
        run: npx lerna run integration --concurrency 1

  coveralls:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Consolidate test coverage from different jobs
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.github_token }}
          parallel-finished: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Load cache
        uses: actions/cache@v6
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-lint-modules-v1-${{ hashFiles('**/yarn.lock') }}
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines
      - name: Run linter
        run: yarn run lint

  docker:
    needs:
      - test
      - lint
    runs-on: ubuntu-latest
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Load cache
        uses: actions/cache@v6
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-docker-modules-v1-${{ hashFiles('**/yarn.lock') }}
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines
      - name: Install Lerna Docker
        run: sh -c "`curl -fsSl https://raw.githubusercontent.com/rubensworks/lerna-docker/master/install.sh`"
      - name: Build Docker images
        run: ~/.lerna-docker/bin/lerna-docker comunica build
      - name: Deploy Docker images
        if: startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/tags/')
        run: ~/.lerna-docker/bin/lerna-docker comunica push
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  performance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        benchmark:
          - watdiv-hdt
          - watdiv-hdt-100
          - bsbm-hdt
          - bsbm-hdt-10k
    needs:
      - test
      - lint
    env:
      BENCHMARK_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          path: head
      - name: Check out the base commit of the pull request
        if: env.BENCHMARK_BASE == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - name: Install dependencies
        run: yarn install
        working-directory: head
      - name: Install dependencies of the base commit
        if: env.BENCHMARK_BASE == 'true'
        run: yarn install
        working-directory: base
      - name: Run benchmarks of the base commit
        if: env.BENCHMARK_BASE == 'true'
        run: cd base/performance/benchmark-${{ matrix.benchmark }}/ && yarn run performance:ci
      - name: Remove containers left behind by the base commit benchmarks
        if: env.BENCHMARK_BASE == 'true'
        run: docker ps -aq | xargs -r docker rm -f
      - name: Run benchmarks
        run: cd head/performance/benchmark-${{ matrix.benchmark }}/ && yarn run performance:ci
      - uses: actions/upload-artifact@v7
        with:
          name: performance-benchmark-${{ matrix.benchmark }}
          path: head/performance/benchmark-${{ matrix.benchmark }}/combinations/combination_0/output/
      - uses: actions/upload-artifact@v7
        if: env.BENCHMARK_BASE == 'true'
        with:
          name: performance-benchmark-base-${{ matrix.benchmark }}
          path: base/performance/benchmark-${{ matrix.benchmark }}/combinations/combination_0/output/

  performance-consolidate:
    needs:
      - performance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-watdiv-hdt
          path: performance/benchmark-watdiv-hdt/combinations/combination_0/output/
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-watdiv-hdt-100
          path: performance/benchmark-watdiv-hdt-100/combinations/combination_0/output/
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-bsbm-hdt
          path: performance/benchmark-bsbm-hdt/combinations/combination_0/output/
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-bsbm-hdt-10k
          path: performance/benchmark-bsbm-hdt-10k/combinations/combination_0/output/
      - name: Process benchmark detailed results
        run: npx -p @rubensworks/process-sparql-benchmark-results psbr csv ghbench performance/benchmark-watdiv-hdt/combinations/combination_0/output/ performance/benchmark-watdiv-hdt-100/combinations/combination_0/output/ performance/benchmark-bsbm-hdt/combinations/combination_0/output/ performance/benchmark-bsbm-hdt-10k/combinations/combination_0/output/ --overrideCombinationLabels WatDiv-HDT,WatDiv-HDT-100,BSBM-HDT,BSBM-HDT-10k --total false --detailed true --name ghbench-detail.json
      - name: Process benchmark total results
        run: npx -p @rubensworks/process-sparql-benchmark-results psbr csv ghbench performance/benchmark-watdiv-hdt/combinations/combination_0/output/ performance/benchmark-watdiv-hdt-100/combinations/combination_0/output/ performance/benchmark-bsbm-hdt/combinations/combination_0/output/ performance/benchmark-bsbm-hdt-10k/combinations/combination_0/output/ --overrideCombinationLabels WatDiv-HDT,WatDiv-HDT-100,BSBM-HDT,BSBM-HDT-10k --total true --detailed false --name ghbench-total.json
      - name: Determine benchmark detailed results target directory name
        run: echo "BENCHMARK_DATA_DIR_PATH_DETAIL=comunica-feature-hdt/${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}/benchmarks-detail" >> $GITHUB_ENV
      - name: Determine benchmarks total results target directory name
        run: echo "BENCHMARK_DATA_DIR_PATH_TOTAL=comunica-feature-hdt/${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}/benchmarks-total" >> $GITHUB_ENV
      - name: Finalize benchmarks detailed results
        if: startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/feature') || startsWith(github.ref, 'refs/heads/next')
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Benchmarks detailed results
          tool: 'customSmallerIsBetter'
          output-file-path: ghbench-detail.json
          github-token: ${{ secrets.PAT }}
          auto-push: true
          alert-comment-cc-users: '@rubensworks'
          gh-repository: 'github.com/comunica/comunica-performance-results'
          gh-pages-branch: 'master'
          benchmark-data-dir-path: ${{ env.BENCHMARK_DATA_DIR_PATH_DETAIL }}
      - name: Cleanup benchmark-action data
        run: rm -rf ./benchmark-data-repository
      - name: Finalize benchmarks total results
        if: startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/feature') || startsWith(github.ref, 'refs/heads/next')
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Benchmarks total results
          tool: 'customSmallerIsBetter'
          output-file-path: ghbench-total.json
          github-token: ${{ secrets.PAT }}
          auto-push: true
          alert-threshold: '150%'
          comment-always: true
          comment-on-alert: true
          alert-comment-cc-users: '@rubensworks'
          fail-on-alert: true
          summary-always: true
          gh-repository: 'github.com/comunica/comunica-performance-results'
          gh-pages-branch: 'master'
          benchmark-data-dir-path: ${{ env.BENCHMARK_DATA_DIR_PATH_TOTAL }}
      - name: Prepare comment on commit with link to performance results
        run: echo -e "Performance benchmarks succeeded! 🚀\n\n\[[Summarized results](https://comunica.github.io/comunica-performance-results/comunica-feature-hdt/${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}/benchmarks-total/)\] \[[Detailed results](https://comunica.github.io/comunica-performance-results/comunica-feature-hdt/${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}/benchmarks-detail/)\]" > ./commit-comment-body.txt
      - name: Comment on commit with link to performance results
        uses: peter-evans/commit-comment@v4
        with:
          body-path: ./commit-comment-body.txt

  performance-compare:
    # Forks receive a read-only GITHUB_TOKEN, which can not post the comparison onto the pull request.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs:
      - performance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-watdiv-hdt
          path: performance/benchmark-watdiv-hdt/combinations/combination_0/output/
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-watdiv-hdt-100
          path: performance/benchmark-watdiv-hdt-100/combinations/combination_0/output/
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-bsbm-hdt
          path: performance/benchmark-bsbm-hdt/combinations/combination_0/output/
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-bsbm-hdt-10k
          path: performance/benchmark-bsbm-hdt-10k/combinations/combination_0/output/
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-base-watdiv-hdt
          path: base/performance/benchmark-watdiv-hdt/combinations/combination_0/output/
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-base-watdiv-hdt-100
          path: base/performance/benchmark-watdiv-hdt-100/combinations/combination_0/output/
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-base-bsbm-hdt
          path: base/performance/benchmark-bsbm-hdt/combinations/combination_0/output/
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-base-bsbm-hdt-10k
          path: base/performance/benchmark-bsbm-hdt-10k/combinations/combination_0/output/
      - name: Process benchmark detailed results
        run: npx -p @rubensworks/process-sparql-benchmark-results psbr csv ghbench performance/benchmark-watdiv-hdt/combinations/combination_0/output/ performance/benchmark-watdiv-hdt-100/combinations/combination_0/output/ performance/benchmark-bsbm-hdt/combinations/combination_0/output/ performance/benchmark-bsbm-hdt-10k/combinations/combination_0/output/ --overrideCombinationLabels WatDiv-HDT,WatDiv-HDT-100,BSBM-HDT,BSBM-HDT-10k --total false --detailed true --name ghbench-detail.json
      - name: Process benchmark total results
        run: npx -p @rubensworks/process-sparql-benchmark-results psbr csv ghbench performance/benchmark-watdiv-hdt/combinations/combination_0/output/ performance/benchmark-watdiv-hdt-100/combinations/combination_0/output/ performance/benchmark-bsbm-hdt/combinations/combination_0/output/ performance/benchmark-bsbm-hdt-10k/combinations/combination_0/output/ --overrideCombinationLabels WatDiv-HDT,WatDiv-HDT-100,BSBM-HDT,BSBM-HDT-10k --total true --detailed false --name ghbench-total.json
      - name: Process base commit benchmark detailed results
        run: npx -p @rubensworks/process-sparql-benchmark-results psbr csv ghbench base/performance/benchmark-watdiv-hdt/combinations/combination_0/output/ base/performance/benchmark-watdiv-hdt-100/combinations/combination_0/output/ base/performance/benchmark-bsbm-hdt/combinations/combination_0/output/ base/performance/benchmark-bsbm-hdt-10k/combinations/combination_0/output/ --overrideCombinationLabels WatDiv-HDT,WatDiv-HDT-100,BSBM-HDT,BSBM-HDT-10k --total false --detailed true --name ghbench-base-detail.json
      - name: Process base commit benchmark total results
        run: npx -p @rubensworks/process-sparql-benchmark-results psbr csv ghbench base/performance/benchmark-watdiv-hdt/combinations/combination_0/output/ base/performance/benchmark-watdiv-hdt-100/combinations/combination_0/output/ base/performance/benchmark-bsbm-hdt/combinations/combination_0/output/ base/performance/benchmark-bsbm-hdt-10k/combinations/combination_0/output/ --overrideCombinationLabels WatDiv-HDT,WatDiv-HDT-100,BSBM-HDT,BSBM-HDT-10k --total true --detailed false --name ghbench-base-total.json
      - name: Wrap the base commit results into baseline data files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO_URL: ${{ github.event.repository.html_url }}
        run: |
          set -eu
          wrap () {
            jq -n \
              --slurpfile benches "ghbench-base-$1.json" \
              --arg name "$2" \
              --arg sha "$BASE_SHA" \
              --arg repo "$REPO_URL" \
              --argjson date "$(date +%s000)" \
              '{
                lastUpdate: $date,
                repoUrl: $repo,
                entries: {
                  ($name): [{
                    commit: {
                      author: { name: "", username: "", email: "" },
                      committer: { name: "", username: "", email: "" },
                      id: $sha,
                      message: "Base commit of the pull request",
                      timestamp: ($date / 1000 | todate),
                      url: "\($repo)/commit/\($sha)"
                    },
                    date: $date,
                    tool: "customSmallerIsBetter",
                    benches: $benches[0]
                  }]
                }
              }' > "baseline-$1.json"
          }
          wrap detail 'Benchmarks detailed results'
          wrap total 'Benchmarks total results'
      # The two comparison steps below read the single entry of the base commit as their baseline,
      # and leave a self-updating comment on the pull request. Passing save-data-file disables
      # the only write these perform, so pull request measurements are never stored.
      - name: Compare benchmark detailed results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Benchmarks detailed results
          tool: 'customSmallerIsBetter'
          output-file-path: ghbench-detail.json
          external-data-json-path: baseline-detail.json
          save-data-file: false
          comment-always: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compare benchmark total results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Benchmarks total results
          tool: 'customSmallerIsBetter'
          output-file-path: ghbench-total.json
          external-data-json-path: baseline-total.json
          save-data-file: false
          comment-always: true
          summary-always: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Load cache
        uses: actions/cache@v6
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-docs-modules-v1-${{ hashFiles('**/yarn.lock') }}
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines
      - name: Build docs
        run: yarn run doc
      - name: Deploy TSDoc to GitHub Pages
        if: startsWith(github.ref, 'refs/heads/master')
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: documentation
          clean: true
